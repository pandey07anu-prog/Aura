services:
  # Node.js Express Backend Web Service
  - type: web
    name: aura-finance-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/categories
    envVars:
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with your MongoDB Atlas SRV URI
      - key: MONGODB_DATABASE
        value: expensetracker
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false # Set to your deployed frontend URL (e.g. https://your-app.vercel.app)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Set to your frontend domain
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@aurafinance.com
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false # Secure password for initial admin provision

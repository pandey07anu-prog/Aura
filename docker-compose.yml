version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-finance-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Set your MongoDB Atlas URI here (or use local mongodb container below):
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/expensetracker}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-expensetracker}
      - JWT_SECRET=${JWT_SECRET:-9a4f2c8d3b7a1e6f5c8b2d4e7a9c1f3b5e7d9a1c3e5b7d9a1c3e5b7d9a1c3e5b}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5173}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@aurafinance.com}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-Admin@123456}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: aura-finance-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
